name: picking_jax
channels:
  - conda-forge
  - nvidia
  - defaults
dependencies:
  # Python - use 3.10 for JAX compatibility
  - python=3.10
  
  # Core numerical computing
  - numpy>=1.23.0,<2.0.0
  - scipy>=1.10.0
  - pandas>=2.0.0
  
  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  
  # Build tools
  - pip
  - setuptools
  - wheel
  - cmake
  
  # OpenGL for visualization (optional - CPU MuJoCo viewer)
  - pyopengl
  - glfw
  
  # Pip dependencies
  - pip:
    # ==================================
    # JAX/Flax - GPU Accelerated ML
    # ==================================
    # Note: For GPU, install separately after conda:
    # pip install --upgrade "jax[cuda12]"
    # or for CPU only: pip install jax jaxlib
    - jax>=0.4.20
    - jaxlib>=0.4.20
    - flax>=0.8.0
    - optax>=0.1.7
    - chex>=0.1.5
    
    # ==================================
    # MuJoCo - Physics Simulation
    # ==================================
    # MJX (GPU) requires mujoco >= 3.0
    - mujoco>=3.0.0
    
    # ==================================
    # Gym & RL
    # ==================================
    - gymnasium>=0.29.0
    
    # ==================================
    # PyTorch - For weight conversion only
    # ==================================
    # Optional: Only needed if converting from PyTorch checkpoints
    # - torch>=2.0.0
    
    # ==================================
    # Numerical & Robotics
    # ==================================
    - numpy-quaternion>=2023.0.0
    - spatialmath-python>=1.1.0
    
    # ==================================
    # Computer Vision
    # ==================================
    - opencv-python>=4.8.0
    - imageio>=2.30.0
    
    # ==================================
    # Configuration & Logging
    # ==================================
    - PyYAML>=6.0
    - omegaconf>=2.3.0
    - hydra-core>=1.3.0
    - wandb>=0.15.0
    - tensorboard>=2.14.0
    - tensorboardX>=2.6.0
    
    # ==================================
    # Utilities
    # ==================================
    - termcolor>=2.3.0
    - tqdm>=4.65.0
    - rich>=13.0.0
    
    # ==================================
    # Development (optional)
    # ==================================
    # - pytest>=7.0.0
    # - black>=23.0.0
    # - ruff>=0.1.0
